# Reverse proxy for a ReAdmin VPS install, generated by ./install.sh.
#
# The panel and the API must be on SEPARATE hostnames — the panel calls the API
# cross-origin, and both names have to match NEXT_PUBLIC_PANEL_URL /
# NEXT_PUBLIC_API_URL / CORS_ORIGINS in .env.
#
# Install:
#   sudo cp deploy/nginx/readmin.conf /etc/nginx/sites-available/readmin
#   sudo ln -s /etc/nginx/sites-available/readmin /etc/nginx/sites-enabled/readmin
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then get certificates (this rewrites both blocks for TLS):
#   sudo certbot --nginx -d __PANEL_HOST__ -d __API_HOST__

server {
    listen 80;
    listen [::]:80;
    server_name __PANEL_HOST__;

    location / {
        proxy_pass http://127.0.0.1:__PANEL_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name __API_HOST__;

    # Workspace exports and image uploads are large; the API itself accepts a
    # 25 MB body, so nginx must not cut them off first.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # CORS is handled by the API itself (CORS_ORIGINS in .env) — do not add
        # add_header Access-Control-* here or the browser sees duplicates.
    }
}
